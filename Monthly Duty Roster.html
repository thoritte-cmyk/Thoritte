const pill=v=>`<span class="p ${v}">${t(v)}</span>`;
function vRoster(){const dp=dept(),u0=me();if(!dp)return`<div class="card">${t('wait')}</div>`;ensure(dp,S.month);
const st=S.users.filter(u=>u.dept==dp),ed=can(dp),days=mdays(S.month),td=iso(new Date()),R=S.roster[dp];
let h=`<div class="bar"><span><button onclick="shiftMonth(-1)" aria-label="Previous month">‹</button> <b>${new Date(S.month+'-01T00:00').toLocaleDateString(loc(),{month:'long',year:'numeric'})}</b> <button onclick="shiftMonth(1)" aria-label="Next month">›</button></span>`;
h+=u0.role=='admin'?`<select aria-label="Department" onchange="S.view=this.value;render()">${S.depts.map(d=>`<option value="${d.id}" ${d.id==dp?'selected':''}>${e(d.name)}</option>`).join('')}</select>`:`<b>${e(dn(dp))}</b>`;
if(ed)h+=`<button class="pr" onclick="regen()">${t('gen')}</button>`;
h+=`</div>${ed?`<div class="bar">${rotCtl(dp)}</div>`:''}<div class="sc"><table><thead><tr><th></th>${days.map(d=>`<th class="${d==td?'td':''} ${dow(d)==0?'wk':''}">${new Date(d+'T00:00').toLocaleDateString(loc(),{weekday:'narrow'})}<br>${+d.slice(8)}${S.hols.includes(d)?'★':''}</th>`).join('')}</tr></thead><tbody>`;
st.forEach(u=>{h+=`<tr class="${u.id==S.me?'me':''}"><th>${e(u.name)}<small>${days.filter(d=>R[d][u.id]=='O').length} OFF</small></th>${days.map(d=>{const v=R[d][u.id]||'O';return`<td class="${dow(d)==0?'wk':''}">${ed?`<select class="p ${v}" aria-label="${e(u.name)} ${d}" onchange="setCell('${dp}','${d}',${u.id},this.value)">${ST.map(s=>`<option value="${s}" ${s==v?'selected':''}>${t(s)}</option>`).join('')}</select>`:pill(v)}</td>`}).join('')}</tr>`});
return h+`</tbody></table></div><p class="mu">${ST.map(v=>pill(v)+' '+t('l'+v)).join(' &nbsp; ')} &nbsp; ★ ${t('hol')}${ed?'':'<br>'+t('ro')}</p>`}
function vLeave(){const u=me(),dp=u.dept;let h='';
if(dp){ensure(dp,S.month);const n=S.hols.filter(d=>d.startsWith(S.month)&&['O','L'].includes(S.roster[dp][d]?.[u.id])).length;
h+=`<div class="card"><h2>${t('hol')}</h2><div class="meter"><i style="width:${Math.min(100,n/Math.max(1,u.allow)*100)}%"></i></div><p class="mu">${n} / ${u.allow} · ${t('allow')}</p></div>
<div class="card"><h2>${t('req')}</h2><div class="bar"><select id="lt"><option value="sick">${t('sick')}</option><option value="annual">${t('annual')}</option></select><input type="date" id="ld"><button class="pr" onclick="req()">${t('submit')}</button></div></div>
<div class="card"><h2>${t('mine')}</h2>`;const m=S.leaves.filter(l=>l.uid==S.me);
h+=(m.length?m.map(l=>`<div class="row"><span>${l.date} · ${t(l.type)}</span><span class="mu">${t(l.status)}${l.cover!=null?' · '+t('by')+' '+e(S.users[l.cover].name):''}</span></div>`).join(''):`<p class="mu">${t('empty')}</p>`)+'</div>'}
if(u.role!='staff'){const L=S.leaves.filter(l=>can(S.users[l.uid].dept)&&(l.status=='pending'||T0[l.shift]!=null));h+=`<div class="card"><h2>${t('review')}</h2>`;
h+=L.length?L.map(l=>{let r=`<div class="row"><span>${e(S.users[l.uid].name)} · ${l.date} · ${t(l.type)} ${l.shift?pill(l.shift):''} <span class="mu">${t(l.status)}${l.cover!=null?' · '+t('by')+' '+e(S.users[l.cover].name):''}</span></span><span>`;
r+=l.status=='pending'?`<button class="pr" onclick="decide(${l.id},1)">${t('approve')}</button> <button class="dg" onclick="decide(${l.id},0)">${t('reject')}</button>`:`<button onclick="open=${open==l.id?'null':l.id};render()">${t('find')}</button>`;r+='</span></div>';
if(open==l.id){const c=cands(l);r+=c.length?c.map((x,i)=>`<div class="row mu"><span>${i?'':'★ '}${e(x.u.name)} · OFF · ${x.h}h · ${x.u.covers}×</span><button onclick="assign(${l.id},${x.u.id})">${t('assign')}</button></div>`).join(''):`<p class="mu">${t('none')}</p>`}return r}).join(''):`<p class="mu">${t('empty')}</p>`;h+='</div>'}return h}
function nextDuty(id){const R=S.roster[S.users[id].dept]||{};for(const d of Object.keys(R).sort()){const s0=R[d][id];if(T0[s0]!=null){const s=new Date(d+'T00:00');s.setHours(T0[s0]);if(s>Date.now())return{d,sh:s0,s}}}}
function vAlarms(){const a=S.alarms[S.me]||[15],ns=nextDuty(S.me);
return`<div class="card"><h2>${t('nextduty')}</h2><p>${ns?`${pill(ns.sh)} ${ns.d} ${String(T0[ns.sh]).padStart(2,'0')}:00`:t('empty')}</p></div>
<div class="card"><h2>${t('remind')}</h2><div class="bar">${[15,30,60,120].map(m=>`<button class="${a.includes(m)?'pr':''}" onclick="tog(${m})">${m<60?m+' min':m/60+' h'}</button>`).join('')}</div>
<div class="bar"><span><input id="cm" type="number" min="1" max="1440" placeholder="${t('custom')}" style="width:130px"> <button onclick="tog(+$('#cm').value)">${t('add')}</button></span><span><button onclick="chime()">${t('test')}</button> <button onclick="Notification.requestPermission()">${t('push')}</button></span></div>
<p class="mu">${a.slice().sort((x,y)=>x-y).join(' · ')} min</p></div>`}
function tog(m){if(!m)return;const a=S.alarms[S.me]||[15];S.alarms[S.me]=a.includes(m)?a.filter(x=>x!=m):[...a,m];save();render()}
function chime(){try{const c=new(window.AudioContext||webkitAudioContext)();[660,880,1100].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+i*.25;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+.22);o.start(s);o.stop(s+.25)})}catch(x){}}
setInterval(()=>{if(S.me==null)return;const ns=nextDuty(S.me);if(!ns)return;(S.alarms[S.me]||[15]).forEach(m=>{const df=ns.s-Date.now()-m*6e4,k=S.me+ns.d+m;if(df<=0&&df>-45e3&&!fired.has(k)){fired.add(k);chime();try{Notification.permission=='granted'&&new Notification(t('app'),{body:`${t(ns.sh)} · ${m} min`})}catch(x){}}})},15000);
const regenAll=()=>{S.depts.forEach(d=>gen(d.id,S.month));render()};
function chg(id,k,v){S.users[id][k]=v||null;regenAll()}
function rotCtl(dp){const d=dp=='*'?S.depts[0]:S.depts.find(x=>x.id==dp),n=d.n||7,p=d.pol||'week',pre=[2,3,4,7].includes(n);
return`<span class="mu">${t('rot')}</span> <select aria-label="${t('rot')}" onchange="setRot('${dp}',this.value=='c'?5:+this.value,null)">${[2,3,4,7].map(x=>`<option value="${x}" ${x==n?'selected':''}>${x==7?t('wk7'):x+' '+t('days')}</option>`).join('')}<option value="c" ${pre?'':'selected'}>${t('cdays')}</option></select>${pre?'':` <input type="number" min="2" max="31" value="${n}" style="width:62px" aria-label="${t('cdays')}" onchange="setRot('${dp}',+this.value,null)">`} <select aria-label="${t('policy')}" onchange="setRot('${dp}',null,this.value)"><option value="week" ${p=='week'?'selected':''}>${t('pweek')}</option><option value="cycle" ${p=='cycle'?'selected':''}>${t('pcycle')}</option></select>`}
function setRot(dp,n,p){const T=dp=='*'?S.depts:[S.depts.find(x=>x.id==dp)];if(!T.every(d=>can(d.id)))return alert(t('perm'));if(!confirm(t('confirm')))return render();T.forEach(d=>{if(n!=null)d.n=Math.max(2,Math.min(31,n||7));if(p)d.pol=p;gen(d.id,S.month)});save();render()}
function vAdmin(){return`<div class="card"><h2>${t('depts')}</h2>`+S.depts.map(d=>`<div class="row"><span>${e(d.name)} <span class="mu">(${S.users.filter(u=>u.dept==d.id).length})</span></span><span>${rotCtl(d.id)}</span></div>`).join('')+`<div class="row"><b>${t('allds')}</b><span>${rotCtl('*')}</span></div><div class="bar"><input id="dnm" placeholder="${t('dname')}"><button onclick="$('#dnm').value&&S.depts.push({id:'d'+Date.now(),name:$('#dnm').value});save();render()">${t('add')}</button></div></div>
<div class="card"><h2>${t('users')}</h2>`+S.users.filter(u=>u.id).map(u=>`<div class="row"><span>${e(u.name)}<br><small class="mu">${e(u.email)}</small></span><span><select aria-label="Role" onchange="chg(${u.id},'role',this.value)">${['staff','supervisor','admin'].map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select> <select aria-label="Department" onchange="chg(${u.id},'dept',this.value)"><option value="">—</option>${S.depts.map(d=>`<option value="${d.id}" ${d.id==u.dept?'selected':''}>${e(d.name)}</option>`).join('')}</select> <input type="number" min="0" max="30" value="${u.allow}" style="width:62px" aria-label="${t('allow')}" onchange="S.users[${u.id}].allow=+this.value;save()"></span></div>`).join('')+`</div>
<div class="card"><h2>${t('holidays')}</h2>${S.hols.sort().map(d=>`<div class="row"><span>★ ${d}</span><button class="dg" aria-label="Remove" onclick="S.hols=S.hols.filter(x=>x!='${d}');regenAll()">✕</button></div>`).join('')}<div class="bar"><input type="date" id="hd"><button onclick="$('#hd').value&&S.hols.push($('#hd').value);regenAll()">${t('add')}</button></div></div>
<button class="dg" onclick="localStorage.removeItem('dr2');init();render()">${t('reset')}</button>`}
function login(i){if(fbAuth)return alert(t('perm'));S.me=i;pick=0;tab='roster';save();render()}
function newUser(){if(fbAuth)return;let u=S.users.find(x=>x.email=='new.user@gmail.com');if(!u){u={id:S.users.length,name:'New User',email:'new.user@gmail.com',role:'staff',dept:null,allow:2,covers:0};S.users.push(u)}login(u.id)}
function vLogin(){
 const demo=`<div class="bar"><span class="mu">${t('demo')}</span><button onclick="pick=pick?0:1;render()">${pick?'Hide':'Show'}</button></div>`+(pick?S.users.map(u=>`<div class="row"><span>${e(u.name)}<br><small class="mu">${e(u.email)}</small></span><button onclick="login(${u.id})">${u.role}${u.dept?' · '+e(dn(u.dept)):''}</button></div>`).join(''):'');
 if(fbAuth){
  if(!fbReady)return`<div class="card"><h2>${t('app')}</h2><p class="mu">${t('checking')}</p></div>`;
  if(fbUser&&!sharedReady)return`<div class="card"><h2>${t('app')}</h2><p class="mu">${t('loading')}</p></div>`;
  return`<div class="card"><h2>${t('app')}</h2><p class="mu">${t('gnote')}</p><div class="bar"><button class="pr" onclick="googleLogin()">${t('google')}</button></div><p id="autherr" class="mu" role="alert" style="color:var(--L)"></p></div>`}
 return`<div class="card"><h2>${t('app')}</h2><p class="mu">${t('gnote')}</p>`+demo+'</div>'}
function render(){const dk=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),L=S.lang=='dv';
document.documentElement.dataset.theme=dk;document.documentElement.lang=L?'dv':'en';document.documentElement.dir=L?'rtl':'ltr';
$('#ttl').textContent=t('app');$('#lg').textContent=L?'EN':'ދިވެހި';$('#th').textContent=dk=='dark'?'☀':'☾';$('#th').setAttribute('aria-label','Theme');
if(S.me==null){$('#usr').textContent='';$('#so').hidden=true;$('#nv').innerHTML='';$('#v').innerHTML=vLogin();return}
const u=me(),tabs=['roster','leave','alarms'].concat(u.role=='admin'?['admin']:[]);if(!tabs.includes(tab))tab='roster';
$('#so').hidden=false;$('#so').textContent=t('so');$('#usr').textContent=`${u.name} · ${u.role}${u.dept?' · '+dn(u.dept):''}${syncState=='error'?' · ⚠ offline':''}`;
$('#nv').innerHTML=tabs.map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${t(k)}</button>`).join('');
$('#v').innerHTML={roster:vRoster,leave:vLeave,alarms:vAlarms,admin:vAdmin}[tab]()}
$('#lg').onclick=()=>{S.lang=S.lang=='dv'?'en':'dv';save();render()};$('#th').onclick=()=>{S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';save();render()};$('#so').onclick=signOut;
if(!S||!S.users||S.v!=3)init();S.v=3;
if(fbAuth){S.me=null;saveLocal();fbAuth.onAuthStateChanged(onAuth);render()}
else{fbReady=true;render()}
</script></body></html>
